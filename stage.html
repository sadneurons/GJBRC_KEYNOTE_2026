<script>
/* The stage: one living diagram behind every slide.
 * Two lines on one axis: the machine's line (1948 onwards, with Jefferson's and Turing's strands)
 * and Maisie's line (9 June 1949) which forks into four women. Their crossings are forks.
 *
 * Slide attributes:
 *   data-stage="N"      Maisie: 0 none, 1 born, 2 to 1960, 3 fork 1960, 4 fork 1965, 5 mid-life forks,
 *                       6 fork 2026, 7 endpoints, 8 places
 *   data-machine="N"    machine: 0 none, 1 Baby 1948, 2 June 1949, 3 1950-51, 4 1952, 5 Turing dies,
 *                       6 Jefferson dies, 7 to 1966, 8 to 2040
 *   data-view="1946-1954"  years shown (time zooms, layout does not)
 *   data-lit="b77,x1965"   branch and crossing ids to light; others dim
 *   data-dim="1"           dim the whole stage behind a large overlay
 * Overlays: class="pin" data-year="1965" (pinned to the year), or class="cover".
 */
(function () {
  var PURPLE = '#462072', DARK = '#2a0b44', TEAL = '#00e6cb', GOLD = '#fbb109', GREY = '#a69bb8', MACHINE = '#6d5a8c';
  var W = 1280, H = 720, AX = 70, AW = 1140;
  var MY = 440, MACH_Y = 150, JEFF_Y = 195, TUR_Y = 240, AXIS_Y = 600;

  var BRANCHES = [
    { id: 'b68', end: 2017, colour: GREY, label: 'diagnosed at 68', place: 'Harpurhey',
      d: { 1960: -46, 1965: -30, 1989: -14, 1999: -10, 2009: -8, 2026: -4 } },
    { id: 'b77', end: 2026, colour: TEAL, label: 'the Brain Health Clinic, 77', place: 'Harpurhey',
      d: { 1960: -46, 1965: 30, 1989: -6, 1999: -2, 2009: 0, 2026: -2 } },
    { id: 'b84', end: 2033, colour: GREY, label: 'diagnosed at 84', place: 'Chorlton',
      d: { 1960: 46, 1965: -30, 1989: 6, 1999: 2, 2009: 0, 2026: 2 } },
    { id: 'b91', end: 2040, colour: GOLD, label: 'the sonnet, 91', place: 'Didsbury',
      d: { 1960: 46, 1965: 30, 1989: 14, 1999: 10, 2009: 8, 2026: 4 } }
  ];
  var FORKS = [
    { year: 1960, stage: 3, text: 'the eleven-plus' },
    { year: 1965, stage: 4, text: 'a wage, a bus stop' },
    { year: 1989, stage: 5, text: "a husband's heart" },
    { year: 1999, stage: 5, text: 'a knee' },
    { year: 2009, stage: 5, text: 'a rota' },
    { year: 2026, stage: 6, text: 'twelve minutes', highlight: true }
  ];
  var BIRTH = 1949.44;
  var STAGE_END = { 0: BIRTH, 1: 1949.7, 2: 1960, 3: 1963.5, 4: 1972, 5: 2014, 6: 2026, 7: 2040, 8: 2040 };
  var MACHINE_EVENTS = [
    { year: 1948.45, strand: 'machine', stage: 1, text: 'the Baby runs, Coupland Street', at: 'above' },
    { year: BIRTH, strand: 'jefferson', stage: 2, text: 'The Mind of Mechanical Man', at: 'above' },
    { year: 1949.45, strand: 'turing', stage: 2, text: 'Calculus to Sonnet', at: 'below' },
    { year: 1950.8, strand: 'turing', stage: 3, text: 'Computing Machinery and Intelligence', at: 'below' },
    { year: 1951.2, strand: 'machine', stage: 3, text: 'Ferranti Mark 1', at: 'above' },
    { year: 1952.05, strand: 'jefferson', stage: 4, text: 'the BBC broadcast', at: 'above' },
    { year: 1954.45, strand: 'turing', stage: 5, text: 'Turing dies, Wilmslow', at: 'below', end: true },
    { year: 1961.08, strand: 'jefferson', stage: 6, text: 'Jefferson dies', at: 'above', end: true },
    { year: 2026, strand: 'machine', stage: 8, text: 'the machine in your pocket', at: 'above' }
  ];
  var MACHINE_END = { 0: 1948.45, 1: 1949.3, 2: 1949.7, 3: 1951.5, 4: 1952.6, 5: 1956, 6: 1962, 7: 1966, 8: 2040 };
  var STRAND_Y = { machine: MACH_Y, jefferson: JEFF_Y, turing: TUR_Y };
  var STRAND_START = { machine: 1948.45, jefferson: BIRTH - 0.6, turing: 1948.8 };
  var STRAND_END = { machine: 2045, jefferson: 1961.08, turing: 1954.45 };
  var CROSSINGS = [
    { id: 'x1949', year: BIRTH, text: 'the same week', stage: 1, machine: 2 },
    { id: 'x1965', year: 1965, text: 'she solders the machine', stage: 4, machine: 7, branch: 'b77' },
    { id: 'x2026', year: 2026, text: 'the machine meets her in the clinic', stage: 6, machine: 8, branch: 'b77' }
  ];

  function el(name, attrs, text) {
    var e = document.createElementNS('http://www.w3.org/2000/svg', name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function ease(t) { return t * t * (3 - 2 * t); }

  // ---------------------------------------------------------------- animated numeric state
  var anim = { v0: 1946, v1: 2045, mEnd: BIRTH, machEnd: 1948.45 };   // tweened
  var disc = { stage: 0, machine: 0, lit: [], dim: false };           // discrete
  function x(year) { return AX + (year - anim.v0) / (anim.v1 - anim.v0) * AW; }
  function span() { return anim.v1 - anim.v0; }

  function branchY(b, year, stage) {
    var y = MY;
    FORKS.forEach(function (f) {
      if (f.stage <= stage && year >= f.year) y += (b.d[f.year] || 0) * ease(Math.min(1, (year - f.year) / 3));
    });
    return y;
  }
  function branchPath(b, stage, endYear) {
    if (endYear <= BIRTH) return '';
    var pts = [], step = Math.max(0.1, span() / 400);
    for (var yr = BIRTH; yr < endYear; yr += step) pts.push(x(yr).toFixed(1) + ',' + branchY(b, yr, stage).toFixed(1));
    pts.push(x(endYear).toFixed(1) + ',' + branchY(b, endYear, stage).toFixed(1));
    return 'M' + pts.join(' L');
  }
  function strandY(strand, year) {
    var base = STRAND_Y[strand];
    if (strand === 'machine') return base;
    var mid = (JEFF_Y + TUR_Y) / 2, pull = 0;
    [BIRTH, 1952.05].forEach(function (m) { var d = Math.abs(year - m); if (d < 0.8) pull = Math.max(pull, 1 - d / 0.8); });
    return base + (mid - base) * ease(pull) * 0.85 * Math.min(1, 14 / span());
  }
  function strandPath(strand, endYear) {
    var s = STRAND_START[strand], e = Math.min(endYear, STRAND_END[strand]);
    if (e <= s) return '';
    var pts = [], step = Math.max(0.05, span() / 600);
    for (var yr = s; yr < e; yr += step) pts.push(x(yr).toFixed(1) + ',' + strandY(strand, yr).toFixed(1));
    pts.push(x(e).toFixed(1) + ',' + strandY(strand, e).toFixed(1));
    return 'M' + pts.join(' L');
  }

  // ---------------------------------------------------------------- build
  var stage = document.createElement('div'); stage.className = 'stage';
  var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'stage-svg' }); stage.appendChild(svg);
  var gAxis = el('g'), gMachine = el('g'), gMaisie = el('g'), gCross = el('g'), gLabels = el('g');
  [gAxis, gMachine, gMaisie, gCross, gLabels].forEach(function (g) { svg.appendChild(g); });

  var axisLine = el('line', { y1: AXIS_Y, y2: AXIS_Y, stroke: PURPLE, 'stroke-width': 1.5, opacity: .45 });
  gAxis.appendChild(axisLine);
  var ticks = [];
  for (var yr = 1946; yr <= 2045; yr += 1) {
    var t = el('line', { y1: AXIS_Y - 6, y2: AXIS_Y + 6, stroke: PURPLE, opacity: .45 });
    var l = el('text', { y: AXIS_Y + 26, 'text-anchor': 'middle', class: 'st-year' }, yr);
    gAxis.appendChild(t); gAxis.appendChild(l); ticks.push({ yr: yr, t: t, l: l });
  }
  var nameMachine = el('text', { y: MACH_Y - 40, class: 'st-linename' }, 'the machine');
  var nameMaisie = el('text', { y: MY - 56, class: 'st-linename' }, 'Maisie');
  gAxis.appendChild(nameMachine); gAxis.appendChild(nameMaisie);

  var strands = {};
  ['machine', 'jefferson', 'turing'].forEach(function (s) {
    strands[s] = el('path', { fill: 'none', stroke: s === 'machine' ? MACHINE : PURPLE, 'stroke-width': s === 'machine' ? 4 : 2.5,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: s === 'machine' ? .9 : .8 });
    gMachine.appendChild(strands[s]);
  });
  var branches = {}, ends = {}, endLabels = {}, places = {};
  BRANCHES.forEach(function (b) {
    branches[b.id] = el('path', { fill: 'none', stroke: PURPLE, 'stroke-width': 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    gMaisie.appendChild(branches[b.id]);
    ends[b.id] = el('circle', { r: 8, fill: b.colour, opacity: 0 });
    endLabels[b.id] = el('text', { class: 'st-endlabel', opacity: 0 }, b.label);
    places[b.id] = el('text', { class: 'st-place', opacity: 0 }, b.place);
    gLabels.appendChild(ends[b.id]); gLabels.appendChild(endLabels[b.id]); gLabels.appendChild(places[b.id]);
  });
  var birth = el('circle', { cy: MY, r: 7, fill: PURPLE, opacity: 0 });
  var birthLabel = el('text', { y: MY + 6, 'text-anchor': 'end', class: 'st-label', opacity: 0 }, '9 June 1949');
  gMaisie.appendChild(birth); gMaisie.appendChild(birthLabel);
  var forkMarks = {};
  FORKS.forEach(function (f) {
    var g = el('g', { opacity: 0 });
    g.appendChild(el('line', { stroke: f.highlight ? TEAL : GOLD, 'stroke-width': f.highlight ? 3 : 2 }));
    g.appendChild(el('text', { 'text-anchor': 'middle', class: 'st-forklabel' + (f.highlight ? ' st-highlightlabel' : '') }, f.year + ': ' + f.text));
    forkMarks[f.year] = g; gLabels.appendChild(g);
  });
  var machineMarks = [];
  MACHINE_EVENTS.forEach(function (ev) {
    var g = el('g', { opacity: 0 });
    g.appendChild(el('circle', { r: ev.end ? 6 : 5, fill: ev.end ? DARK : (ev.strand === 'machine' ? MACHINE : PURPLE) }));
    g.appendChild(el('text', { class: 'st-eventlabel' }, ev.text));
    machineMarks.push({ ev: ev, g: g }); gLabels.appendChild(g);
  });
  var crossMarks = {};
  CROSSINGS.forEach(function (c) {
    var g = el('g', { opacity: 0 });
    g.appendChild(el('line', { stroke: GOLD, 'stroke-width': 2, 'stroke-dasharray': '6 6' }));
    g.appendChild(el('circle', { r: 9, fill: '#fff', stroke: GOLD, 'stroke-width': 3 }));
    g.appendChild(el('text', { class: 'st-crosslabel' }, c.text));
    crossMarks[c.id] = g; gCross.appendChild(g);
  });

  // ---------------------------------------------------------------- redraw from anim + disc
  function setText(t, px, anchorRight) {
    t.setAttribute('x', px + (anchorRight ? -14 : 14));
    t.setAttribute('text-anchor', anchorRight ? 'end' : 'start');
  }
  function redraw() {
    var st = disc.stage, ms = disc.machine, lit = disc.lit, sp = span();
    axisLine.setAttribute('x1', AX); axisLine.setAttribute('x2', AX + AW);
    var every = sp > 60 ? 10 : sp > 25 ? 5 : 1;
    ticks.forEach(function (k) {
      var on = k.yr % every === 0 && k.yr >= anim.v0 && k.yr <= anim.v1;
      k.t.style.opacity = on ? 1 : 0; k.l.style.opacity = on ? 1 : 0;
      k.t.setAttribute('x1', x(k.yr)); k.t.setAttribute('x2', x(k.yr)); k.l.setAttribute('x', x(k.yr));
    });
    nameMachine.setAttribute('x', AX); nameMaisie.setAttribute('x', AX);
    nameMachine.style.opacity = ms >= 1 ? 1 : 0; nameMaisie.style.opacity = st >= 1 ? 1 : 0;

    var shown = st >= 3 ? BRANCHES : [BRANCHES[1]];
    BRANCHES.forEach(function (b) {
      var on = st >= 1 && shown.indexOf(b) >= 0;
      var e = Math.min(anim.mEnd, st >= 7 ? b.end : 2045);
      branches[b.id].setAttribute('d', on ? branchPath(b, st, e) : '');
      branches[b.id].setAttribute('stroke', st >= 7 ? b.colour : PURPLE);
      branches[b.id].style.opacity = (!lit.length || lit.indexOf(b.id) >= 0) ? 1 : .22;
      var ey = branchY(b, b.end, st), ex = x(b.end), showEnd = st >= 7 && anim.mEnd >= b.end - 0.5;
      ends[b.id].setAttribute('cx', ex); ends[b.id].setAttribute('cy', ey); ends[b.id].style.opacity = showEnd ? 1 : 0;
      var tight = ex > W - 230;
      setText(endLabels[b.id], ex, tight); endLabels[b.id].setAttribute('y', tight ? ey - 14 : ey + 5); endLabels[b.id].style.opacity = showEnd ? 1 : 0;
      setText(places[b.id], ex, tight); places[b.id].setAttribute('y', tight ? ey + 24 : ey + 23); places[b.id].style.opacity = st >= 8 ? 1 : 0;
    });
    birth.setAttribute('cx', x(BIRTH)); birthLabel.setAttribute('x', x(BIRTH) - 12);
    birth.style.opacity = st >= 1 ? 1 : 0; birthLabel.style.opacity = st >= 1 ? 1 : 0;
    var lane = 0;
    FORKS.forEach(function (f) {
      var g = forkMarks[f.year], on = f.stage <= st && anim.mEnd >= f.year;
      g.style.opacity = on ? 1 : 0;
      var yTop = Math.min.apply(null, shown.map(function (b) { return branchY(b, f.year + 3, st); })) - 8;
      var lift = [30, 52, 74, 30, 96, 74][lane % 6]; if (on) lane += 1;
      var line = g.firstChild, txt = g.lastChild, fx = x(f.year);
      line.setAttribute('x1', fx); line.setAttribute('x2', fx); line.setAttribute('y1', yTop - lift + 6); line.setAttribute('y2', yTop + 4);
      txt.setAttribute('x', fx); txt.setAttribute('y', yTop - lift);
      txt.setAttribute('text-anchor', fx > W - 160 ? 'end' : fx < 160 ? 'start' : 'middle');
    });
    ['machine', 'jefferson', 'turing'].forEach(function (k) { strands[k].setAttribute('d', ms >= 1 ? strandPath(k, anim.machEnd) : ''); });
    var laneCount = {};
    machineMarks.forEach(function (m, i) {
      var ev = m.ev, on = ev.stage <= ms && anim.machEnd >= ev.year - 0.05, px = x(ev.year), py = strandY(ev.strand, ev.year);
      m.g.style.opacity = on ? 1 : 0;
      m.g.firstChild.setAttribute('cx', px); m.g.firstChild.setAttribute('cy', py);
      var key = ev.strand + ev.at, n = laneCount[key] = (laneCount[key] || 0) + 1;
      var t = m.g.lastChild, lane = ((n - 1) % 2) * 16;
      t.style.opacity = (sp <= 22 || ev.strand === 'machine') ? 1 : 0;
      t.setAttribute('y', ev.at === 'above' ? py - 12 - lane : py + 22 + lane);
      t.setAttribute('x', px + (px > W - 300 ? -10 : 8)); t.setAttribute('text-anchor', px > W - 300 ? 'end' : 'start');
    });
    CROSSINGS.forEach(function (c) {
      var g = crossMarks[c.id], on = c.stage <= st && c.machine <= ms && anim.mEnd >= c.year - 0.1 && anim.machEnd >= c.year - 0.1;
      g.style.opacity = on ? (lit.indexOf(c.id) >= 0 ? 1 : .5) : 0;
      var by = c.branch ? branchY(BRANCHES.filter(function (b) { return b.id === c.branch; })[0], c.year, st) : MY;
      var px = x(c.year), my = (MACH_Y + by) / 2;
      g.childNodes[0].setAttribute('x1', px); g.childNodes[0].setAttribute('x2', px); g.childNodes[0].setAttribute('y1', MACH_Y); g.childNodes[0].setAttribute('y2', by);
      g.childNodes[1].setAttribute('cx', px); g.childNodes[1].setAttribute('cy', my);
      setText(g.childNodes[2], px, px > W - 340); g.childNodes[2].setAttribute('y', my + 5);
      g.childNodes[2].style.opacity = (sp <= 60 || lit.indexOf(c.id) >= 0) ? 1 : 0;
    });
    stage.classList.toggle('st-dim', !!disc.dim);
  }

  var raf = null;
  function tweenTo(target, ms) {
    var from = { v0: anim.v0, v1: anim.v1, mEnd: anim.mEnd, machEnd: anim.machEnd }, t0 = performance.now();
    if (raf) cancelAnimationFrame(raf);
    var step = function (now) {
      var t = Math.min(1, (now - t0) / ms), e = ease(t);
      for (var k in target) anim[k] = from[k] + (target[k] - from[k]) * e;
      redraw();
      if (t < 1) raf = requestAnimationFrame(step); else raf = null;
    };
    raf = requestAnimationFrame(step);
  }

  function stateOf(section) {
    var d = section.dataset, view = (d.view || '1946-2045').split('-').map(Number);
    return { stage: +(d.stage || 0), machine: +(d.machine || 0), view: view, lit: (d.lit || '').split(',').filter(Boolean), dim: d.dim === '1' };
  }
  function applyState(s, instant) {
    disc = { stage: s.stage, machine: s.machine, lit: s.lit, dim: s.dim };
    var target = { v0: s.view[0], v1: s.view[1], mEnd: STAGE_END[s.stage], machEnd: MACHINE_END[s.machine] };
    if (instant) { for (var k in target) anim[k] = target[k]; redraw(); } else tweenTo(target, 900);
  }
  function placeCallouts(section, s) {
    var v0 = s.view[0], v1 = s.view[1];
    section.querySelectorAll('.pin[data-year]').forEach(function (c) {
      var yr = parseFloat(c.dataset.year), px = AX + (yr - v0) / (v1 - v0) * AW;
      var w = c.offsetWidth || 360, left = px - w / 2;
      if (c.classList.contains('left')) left = px - w - 24; else if (c.classList.contains('right')) left = px + 24;
      c.style.left = Math.max(20, Math.min(W - 20 - w, left)) + 'px';
    });
  }
  function wire() {
    var slides = document.querySelector('.reveal .slides');
    slides.insertBefore(stage, slides.firstChild);
    var first = true;
    var update = function () {
      var sec = Reveal.getCurrentSlide();
      var has = sec && ('stage' in sec.dataset || 'machine' in sec.dataset);
      stage.style.opacity = has ? 1 : 0;
      if (has) { var s = stateOf(sec); applyState(s, first); placeCallouts(sec, s); }
      first = false;
    };
    Reveal.on('slidechanged', update);
    update();
  }
  if (window.Reveal && Reveal.isReady && Reveal.isReady()) wire();
  else window.addEventListener('load', function () { Reveal.on('ready', wire); if (Reveal.isReady()) wire(); });
})();
</script>
<style>
.reveal .slides .stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; z-index: 0; pointer-events: none;
  opacity: 0; transition: opacity .5s; }
.reveal .slides .stage.st-dim { opacity: .18 !important; }
.reveal .slides .stage-svg { width: 100%; height: 100%; font-family: "Open Sans", Arial, sans-serif; }
.reveal .slides .stage path, .reveal .slides .stage circle, .reveal .slides .stage g, .reveal .slides .stage text { transition: opacity .5s; }
.st-year { font-size: 15px; fill: #462072; opacity: .6; }
.st-linename { font-family: "Asap", sans-serif; font-weight: 700; font-size: 22px; fill: #462072; opacity: .85; }
.st-label { font-size: 16px; fill: #462072; }
.st-endlabel { font-size: 19px; font-weight: 600; fill: #462072; }
.st-place { font-size: 15px; fill: #462072; opacity: .7; font-style: italic; }
.st-forklabel { font-size: 15px; fill: #462072; }
.st-highlightlabel { font-size: 18px; font-weight: 700; fill: #2a0b44; }
.st-eventlabel { font-size: 14px; fill: #462072; opacity: .85; }
.st-crosslabel { font-size: 16px; font-weight: 600; fill: #2a0b44; }

/* slides on the stage: transparent, content is overlays */
.reveal .slides section.slide.on-stage { padding: 0; background: transparent; }
.reveal .slides section.slide.on-stage > h2:first-child { position: absolute; left: 60px; top: 24px; margin: 0; height: auto; font-size: 34px; }
.reveal .slides section.slide .pin { position: absolute; width: 360px; background: rgba(255,255,255,.96); border: 1.5px solid rgba(70,32,114,.25);
  border-radius: 6px; padding: 14px 18px; box-shadow: 0 6px 24px rgba(42,11,68,.12); font-size: 17px; line-height: 1.35; color: #462072; z-index: 2; }
.reveal .slides section.slide .pin.below { bottom: 36px; }
.reveal .slides section.slide .pin.above { top: 70px; }
.reveal .slides section.slide .pin.mid { top: 230px; }
.reveal .slides section.slide .pin.wide { width: 520px; }
.reveal .slides section.slide .pin p { margin: 0 0 .4em 0; font-size: 17px; }
.reveal .slides section.slide .pin p:last-child { margin-bottom: 0; }
.reveal .slides section.slide .pin img, .reveal .slides section.slide .pin video { width: 100%; max-height: 240px; object-fit: cover; display: block; margin: 0 0 8px 0; }
.reveal .slides section.slide .pin .q { font-family: "Asap", sans-serif; font-weight: 700; font-size: 21px; line-height: 1.25; }
.reveal .slides section.slide .pin .who { font-size: 14px; opacity: .7; }
.reveal .slides section.slide .cover { position: absolute; left: 90px; top: 70px; width: 1100px; height: 580px; background: rgba(255,255,255,.97);
  border-radius: 8px; box-shadow: 0 10px 40px rgba(42,11,68,.18); padding: 36px 48px; box-sizing: border-box; z-index: 2; color: #462072; }
.reveal .slides section.slide .cover h3 { margin: 0 0 .5em 0; font-size: 32px; }
.reveal .slides section.slide .cover .q { font-family: "Asap", sans-serif; font-weight: 700; font-size: 40px; line-height: 1.2; margin: 0; }
.reveal .slides section.slide .cover .q.small { font-size: 30px; }
.reveal .slides section.slide .cover .who { font-size: 18px; opacity: .7; margin-top: 1em; }
.reveal .slides section.slide .cover .sonnet { font-style: italic; font-size: 28px; line-height: 1.45; margin: 0; }
.reveal .slides section.slide .cover .stat { font-family: "Asap", sans-serif; font-weight: 700; font-size: 110px; line-height: 1; margin: 0; }
.reveal .slides section.slide .cover ul { margin: 0; padding-left: 0; }
.reveal .slides section.slide .cover li { font-size: 24px; margin-bottom: .5em; }
.reveal .slides section.slide .cover .two { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
.reveal .slides section.slide .cover img { max-height: 480px; width: 100%; object-fit: contain; display: block; margin: 0; }
.reveal .slides section.slide .cover .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px 36px; }
.reveal .slides section.slide .cover .grid3 h4 { margin: 0 0 .25em 0; font-size: 22px; }
.reveal .slides section.slide .cover .grid3 p { margin: 0; font-size: 17px; line-height: 1.35; }
.reveal .slides section.slide .cover.dark { background: #2a0b44; color: #fff; }
.reveal .slides section.slide .cover.dark .q, .reveal .slides section.slide .cover.dark h3, .reveal .slides section.slide .cover.dark p { color: #fff; }
.reveal .slides section.slide .note { font-size: 15px; opacity: .55; position: absolute; bottom: 14px; left: 60px; right: 300px; margin: 0; color: #462072; }
</style>
