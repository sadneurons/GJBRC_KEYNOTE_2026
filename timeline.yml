span: [1946, 2045]
lines:
  - id: machine
    label: The machine
    start: 1948-06-21
    colour: "#6d5a8c"
    strands:
      - { id: jefferson, label: Jefferson, start: 1949-06-09, end: 1961-01-29 }
      - { id: turing, label: Turing, start: 1948-09, end: 1954-06-07 }
    meets:
      - [jefferson, turing, 1949-06-09]
      - [jefferson, turing, 1952-01-10]
    events:
      - { id: baby, year: 1948-06-21, label: "the Manchester Baby runs its first program", side: above }
      - { id: turing-arrives, year: 1948-09, label: Turing arrives in Manchester, on: turing, side: below }
      - { id: lister, year: 1949-06-09, label: The Mind of Mechanical Man, on: jefferson, side: above }
      - { id: times, year: 1949-06-11, label: Calculus to Sonnet, on: turing, side: below }
      - { id: paper, year: 1950-10-01, label: Computing Machinery and Intelligence, on: turing, side: below }
      - { id: mark1, year: 1951-02-01, label: Ferranti Mark 1, side: above }
      - { id: bbc, year: 1952-01-10, label: the BBC broadcast, on: jefferson, side: above }
      - { id: turing-dies, year: 1954-06-07, label: "Turing dies, Wilmslow", on: turing, side: below, end: true }
      - { id: jefferson-dies, year: 1961-01-29, label: Jefferson dies, on: jefferson, side: above, end: true }
      - { id: pocket, year: 2026, label: the machine in your pocket, side: above }

  - id: maisie
    label: Maisie
    start: 1948-06-21
    events:
      - { id: born, year: 1948-06-21, label: "born at home, off Rochdale Road", side: below }
      - { id: child-grammar, year: 1978, label: "first child, at thirty", on: grammar }
      - { id: child-ferranti, year: 1969, label: "first child, at twenty-one", on: ferranti }
      - { id: child-ferranti-s, year: 1969, label: "first child, at twenty-one", on: ferranti-smokes }
      - { id: child-machinist, year: 1968, label: "first child, at twenty", on: machinist }
      - { id: child-machinist-s, year: 1968, label: "first child, at twenty", on: machinist-smokes }
    forks:
      # 1951: the family keeps growing, or doesn't
      - at: 1951
        label: one more child, or six more
        children:
          - id: small-family
            label: one more
            forks:
              # 1960: in the small family the exam is a real fork
              - at: 1960
                label: passes the eleven-plus
                children:
                  - { id: grammar, label: the grammar school }
                  - id: modern-by-choice
                    label: the secondary modern anyway
                    forks:
                      # 1965: work, and the cigarette that comes with it
                      - at: 1965
                        label: "Ferranti, the production line"
                        children:
                          - { id: ferranti, label: never smokes }
                          - id: ferranti-smokes
                            label: "smokes, at the bus stop on Moston Lane"
                            forks:
                              # 1989: a husband's angina
                              - at: 1989
                                label: a husband's angina
                                children:
                                  - id: ferranti-quits
                                    label: they stop together
                                    forks:
                                      # 2009: hearing
                                      - at: 2009
                                        label: hearing
                                        children:
                                          - { id: hearing-aids, label: "hearing aids; a daughter's morning at Crumpsall" }
                                          - { id: hearing-none, label: no hearing aids }
                                  - { id: ferranti-still, label: she doesn't }
          - id: large-family
            label: six more
            forks:
              - at: 1965
                label: "a machinist's job, not at Ferranti"
                children:
                  - id: machinist
                    label: never smokes
                    forks:
                      # 1999: blood pressure, found or not
                      - at: 1999
                        label: blood pressure, 165 over 95
                        children:
                          - { id: bp-treated, label: "found because of a knee; a prescription, a nurse who rings" }
                          - { id: bp-untreated, label: no knee, no appointment, fifteen years untreated }
                  - { id: machinist-smokes, label: smokes }
    forks-on:
      # the same exam, a formality in the large family
      - { at: 1960, label: fails the eleven-plus, branches: [large-family] }
      - { at: 1965, label: stays on at school, branches: [grammar] }
      - { at: 1989, label: never stops, branches: [machinist-smokes] }
      - { at: 2012, label: "stops going to the Tuesday club", branches: [hearing-none] }

