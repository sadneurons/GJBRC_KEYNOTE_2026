<script>
/* The garden of forking paths: one life line, 1840 to 2040, that forks.
 *
 * Usage in a slide:
 *   <div class="forks" data-stage="2"></div>
 * Stages (cumulative):
 *   0 the three women before her (1840, 1878, 1915)
 *   1 Maisie's line from 1949
 *   2 1960, the eleven-plus: two branches
 *   3 1965, Ferranti and the bus stop
 *   4 1989 smoking, 1999 blood pressure, 2009 hearing: four branches
 *   5 2026, twelve minutes in a surgery: the fork we can turn
 *   6 the four women at 77: diagnosed at 68, 77, 84, 91
 *   7 where they live
 * Fragments inside the same slide can advance the stage:
 *   <span class="fragment forks-stage" data-stage="3"></span>
 */
(function () {
  var PURPLE = '#462072', DARK = '#2a0b44', TEAL = '#00e6cb', GOLD = '#fbb109', GREY = '#9a8fb0';
  var X0 = 60, X1 = 1060, Y0 = 1840, Y1 = 2045;
  function x(year) { return X0 + (year - Y0) / (Y1 - Y0) * (X1 - X0); }

  // four branches of Maisie, top to bottom: the woman diagnosed at 68, 77, 84, 91
  var BRANCHES = [
    { id: 'b68', end: 2017, age: 68, colour: GREY,  label: 'diagnosed at 68', place: 'Harpurhey',
      d: { 1960: -34, 1965: -22, 1989: -10, 1999: -8, 2009: -6, 2026: -4 } },
    { id: 'b77', end: 2026, age: 77, colour: TEAL,  label: 'Brain Health Clinic, 77', place: 'Harpurhey',
      d: { 1960: -34, 1965:  22, 1989:  -4, 1999: -2, 2009:  0, 2026: -2 } },
    { id: 'b84', end: 2033, age: 84, colour: GREY,  label: 'diagnosed at 84', place: 'Chorlton',
      d: { 1960:  34, 1965: -22, 1989:   4, 1999:  2, 2009:  0, 2026:  2 } },
    { id: 'b91', end: 2040, age: 91, colour: GOLD,  label: 'the sonnet, 91', place: 'Didsbury',
      d: { 1960:  34, 1965:  22, 1989:  10, 1999:  8, 2009:  6, 2026:  4 } }
  ];
  var FORKS = [
    { year: 1960, stage: 2, text: 'the eleven-plus' },
    { year: 1965, stage: 3, text: 'a wage, a bus stop' },
    { year: 1989, stage: 4, text: "a husband's heart" },
    { year: 1999, stage: 4, text: 'a knee' },
    { year: 2009, stage: 4, text: 'a rota' },
    { year: 2026, stage: 5, text: 'twelve minutes', highlight: true }
  ];
  var ANCESTORS = [
    { born: 1840, died: 1859, y: 48,  label: 'her great-grandmother, Little Ireland, typhus at 19' },
    { born: 1878, died: 1944, y: 84,  label: 'her grandmother, 66' },
    { born: 1915, died: 1996, y: 120, label: 'her mother, 81' }
  ];
  var BASE_Y = 250; // Maisie's single line before the forks

  function el(name, attrs, text) {
    var e = document.createElementNS('http://www.w3.org/2000/svg', name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }

  // y of branch b at a given year: branches peel apart progressively at fork years
  function branchY(b, year, stage) {
    var y = BASE_Y;
    FORKS.forEach(function (f) {
      if (f.stage <= stage && year >= f.year) {
        // ease over three years after the fork so the split reads as a curve, not a step
        var t = Math.min(1, (year - f.year) / 3);
        y += (b.d[f.year] || 0) * (t * t * (3 - 2 * t));
      }
    });
    return y;
  }

  function pathFor(b, stage, toYear) {
    var pts = [], y;
    for (var yr = 1949; yr <= toYear; yr += 1) {
      y = branchY(b, yr, stage);
      pts.push([x(yr), y]);
    }
    return 'M' + pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' L');
  }

  function render(container, stage) {
    stage = +stage;
    container.innerHTML = '';
    var svg = el('svg', { viewBox: '0 0 1280 400', class: 'forks-svg' });
    container.appendChild(svg);

    // axis
    var axis = el('g', { class: 'forks-axis' });
    axis.appendChild(el('line', { x1: X0, y1: 372, x2: X1 + 20, y2: 372, stroke: PURPLE, 'stroke-width': 1.5, opacity: .5 }));
    [1840, 1880, 1920, 1960, 2000, 2040].forEach(function (yr) {
      axis.appendChild(el('line', { x1: x(yr), y1: 366, x2: x(yr), y2: 378, stroke: PURPLE, opacity: .5 }));
      axis.appendChild(el('text', { x: x(yr), y: 392, 'text-anchor': 'middle', class: 'forks-year' }, yr));
    });
    svg.appendChild(axis);

    // ancestors
    ANCESTORS.forEach(function (a) {
      var g = el('g', { class: 'forks-ancestor' });
      g.appendChild(el('line', { x1: x(a.born), y1: a.y, x2: x(a.died), y2: a.y, stroke: PURPLE, 'stroke-width': 3, 'stroke-linecap': 'round' }));
      g.appendChild(el('circle', { cx: x(a.died), cy: a.y, r: 5, fill: PURPLE }));
      g.appendChild(el('text', { x: x(a.born), y: a.y - 9, class: 'forks-label' }, a.label));
      svg.appendChild(g);
    });

    if (stage < 1) return;

    // the line that connects the women: a faint vertical at birth years
    var toYear = stage >= 6 ? 2040 : stage >= 5 ? 2026 : stage >= 4 ? 2012 : stage >= 3 ? 1970 : stage >= 2 ? 1963 : 1960;
    var shown = stage >= 2 ? BRANCHES : [BRANCHES[1]];
    shown.forEach(function (b, i) {
      var end = Math.min(toYear, stage >= 6 ? b.end : toYear);
      var p = el('path', { d: pathFor(b, stage, end), fill: 'none', stroke: stage >= 6 ? b.colour : PURPLE,
        'stroke-width': stage >= 6 && b.colour !== GREY ? 5 : 3.5, 'stroke-linecap': 'round', class: 'forks-branch ' + b.id });
      svg.appendChild(p);
      if (stage >= 6) {
        var ey = branchY(b, b.end, stage);
        svg.appendChild(el('circle', { cx: x(b.end), cy: ey, r: 7, fill: b.colour, class: 'forks-end' }));
        svg.appendChild(el('text', { x: x(b.end) + 12, y: ey + 5, class: 'forks-label forks-end-label' }, b.label));
        if (stage >= 7) svg.appendChild(el('text', { x: x(b.end) + 12, y: ey + 22, class: 'forks-place' }, b.place));
      }
    });
    // birth mark
    svg.appendChild(el('circle', { cx: x(1949), cy: BASE_Y, r: 6, fill: PURPLE }));
    svg.appendChild(el('text', { x: x(1949), y: BASE_Y - 14, 'text-anchor': 'middle', class: 'forks-label' }, 'Maisie, 1949'));

    // fork markers
    var lane = 0;
    FORKS.forEach(function (f) {
      if (f.stage > stage) return;
      var yTop = Math.min.apply(null, shown.map(function (b) { return branchY(b, f.year + 3, stage); })) - 6;
      var lift = [26, 46, 66, 26, 86, 66][lane % 6]; lane += 1;
      var g = el('g', { class: 'forks-fork' + (f.highlight ? ' forks-highlight' : '') });
      g.appendChild(el('line', { x1: x(f.year), y1: yTop - lift + 6, x2: x(f.year), y2: yTop + 4, stroke: f.highlight ? TEAL : GOLD, 'stroke-width': f.highlight ? 3 : 2 }));
      g.appendChild(el('text', { x: x(f.year), y: yTop - lift, 'text-anchor': 'middle', class: 'forks-fork-label' + (f.highlight ? ' forks-highlight-label' : '') }, f.year + ': ' + f.text));
      svg.appendChild(g);
    });
  }

  function renderAll() {
    document.querySelectorAll('.forks').forEach(function (c) { render(c, c.dataset.stage || 0); });
  }
  function wire() {
    renderAll();
    Reveal.on('fragmentshown', function (e) {
      var f = e.fragment; if (!f.classList.contains('forks-stage')) return;
      var c = Reveal.getCurrentSlide().querySelector('.forks'); if (c) render(c, f.dataset.stage);
    });
    Reveal.on('fragmenthidden', function (e) {
      var f = e.fragment; if (!f.classList.contains('forks-stage')) return;
      var slide = Reveal.getCurrentSlide(), c = slide.querySelector('.forks'); if (!c) return;
      var vis = slide.querySelectorAll('.fragment.forks-stage.visible');
      render(c, vis.length ? vis[vis.length - 1].dataset.stage : c.dataset.stage || 0);
    });
  }
  if (window.Reveal && Reveal.isReady && Reveal.isReady()) wire();
  else window.addEventListener('load', function () { Reveal.on('ready', wire); if (Reveal.isReady()) wire(); });
})();
</script>
<style>

.reveal .forks-svg { width: 100%; height: 100%; font-family: "Open Sans", Arial, sans-serif; }
.reveal .forks-year { font-size: 14px; fill: #462072; opacity: .7; }
.reveal .forks-label { font-size: 15px; fill: #462072; }
.reveal .forks-end-label { font-size: 17px; font-weight: 600; }
.reveal .forks-place { font-size: 14px; fill: #462072; opacity: .7; font-style: italic; }
.reveal .forks-fork-label { font-size: 15px; fill: #462072; }
.reveal .forks-highlight-label { fill: #2a0b44; font-weight: 700; font-size: 17px; }
.reveal .forks-branch { transition: d .6s ease; }
.reveal .slides section.slide.forks-slide > h2:first-child { height: auto; margin-top: 38px; margin-bottom: 0; font-size: 40px; }
.reveal .slides section.slide .quote { font-family: "Asap", sans-serif; font-weight: 700; font-size: 44px; line-height: 1.2; color: #462072; margin: 0; }

.reveal .slides section.slide.image-copy.contain .photo { background: #fff; }
.reveal .slides section.slide.image-copy .note { left: 54.2%; right: 6.9%; }
.reveal .slides section.slide .photo p, .reveal .slides section.slide .photo .quarto-figure, .reveal .slides section.slide .photo figure { height: 100%; margin: 0; }
.reveal .slides section.slide.image-copy.contain .photo img { object-fit: contain !important; }
.reveal .slides section.slide.center-text { display: flex !important; flex-direction: column; justify-content: center; padding-right: 20%; }
.reveal .slides section.slide.center-text > h2:first-child { height: auto; margin: 0 0 .5em 0; }

/* two photos side by side on an .image-1 slide */
.reveal .slides section.slide.image-1 .photo.left  { left: 4%;  width: 44%; top: 12%; height: 76%; }
.reveal .slides section.slide.image-1 .photo.right { left: 52%; width: 44%; top: 12%; height: 76%; }

.reveal .slides section.slide .video video, .reveal .slides section.slide .video iframe { width: 100%; max-height: 220px; display: block; }
</style>
